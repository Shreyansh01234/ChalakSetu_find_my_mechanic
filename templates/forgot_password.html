<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - ChalakSetu</title>
  <link rel="icon" href="https://png.pngtree.com/png-clipart/20230812/original/pngtree-auto-mechanic-icon-color-flat-picture-image_7877632.png" type="image/png">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }

    .forgot-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
    }

    .forgot-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .forgot-box label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .forgot-box input, .forgot-box button {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    .forgot-box input {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .forgot-box input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
    }

    .forgot-box button {
      background: linear-gradient(to right, #6366f1, #38bdf8);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .forgot-box button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px #38bdf8;
    }

    .flash {
      background: rgba(255, 0, 0, 0.2);
      border-left: 4px solid red;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <form action="/forgot_password" method="POST" class="forgot-box">
    <h2>🔒 Forgot Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <label for="email">Enter your registered Email:</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>

    <button type="submit">Send OTP</button>
  </form>

</body>
</html>
