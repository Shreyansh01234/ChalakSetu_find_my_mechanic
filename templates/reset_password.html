<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - ChalakSetu</title>
  <link rel="icon" href="https://png.pngtree.com/png-clipart/20230812/original/pngtree-auto-mechanic-icon-color-flat-picture-image_7877632.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      color: #fff;
    }

    .reset-box {
      background: rgba(255, 255, 255, 0.06);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(20px);
    }

    .reset-box h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    input {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 10px #38bdf8;
    }

    button {
      background: linear-gradient(to right, #6366f1, #38bdf8);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px #38bdf8;
    }

    .flash {
      background: rgba(255, 0, 0, 0.2);
      border-left: 4px solid red;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <form method="POST" action="/reset_password" class="reset-box">
    <h2>🔑 Reset Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <input type="password" name="password" placeholder="Enter New Password" required>
    <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
    <button type="submit">Reset Password</button>
  </form>

</body>
</html>
