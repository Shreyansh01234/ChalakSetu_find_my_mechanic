<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChalakSetu Sign Up</title>
  <link rel="icon" href="https://png.pngtree.com/png-clipart/20230812/original/pngtree-auto-mechanic-icon-color-flat-picture-image_7877632.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent1: #4facfe;
      --accent2: #00f2fe;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.2);
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(270deg, #1e293b, #0f172a);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px);
      opacity: 0.3; animation: float 25s ease-in-out infinite alternate;
    }
    .blob1 {
      width: 300px; height: 300px; background: var(--accent1);
      top: -80px; left: -100px;
    }
    .blob2 {
      width: 250px; height: 250px; background: var(--accent2);
      bottom: -60px; right: -60px; animation-delay: 8s;
    }
    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }
    .container {
      position: relative; z-index: 2; width: 90%; max-width: 500px; padding: 20px;
    }
    .form-container {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px); border-radius: 20px;
      box-shadow: 0 0 40px rgba(0,0,0,0.4); padding: 40px;
      animation: fadeIn 1s ease forwards; color: #fff;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    h2 {
      text-align: center; font-size: 28px; margin-bottom: 30px;
      text-shadow: 1px 1px 10px rgba(0,0,0,0.4);
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block; font-size: 14px; margin-bottom: 6px; color: #d1d5db;
    }
    .input-group input {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: rgba(255,255,255,0.15); color: #fff; transition: 0.3s;
    }
    .input-group input::placeholder {
      color: #cbd5e1;
    }
    .input-group input:focus {
      background: rgba(255,255,255,0.25); outline: none;
      box-shadow: 0 0 10px var(--accent2);
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(to right, var(--accent1), var(--accent2));
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: 0.3s; box-shadow: 0 0 15px var(--accent2);
    }
    button:hover {
      transform: scale(1.05); box-shadow: 0 0 25px var(--accent2);
    }
    .form-actions {
      margin-top: 18px; text-align: center; font-size: 14px;
    }
    .form-actions a {
      color: var(--accent2); text-decoration: none;
    }
    .form-actions a:hover {
      text-decoration: underline;
    }
    .flash {
      background: rgba(255, 0, 0, 0.2); border-left: 4px solid red;
      padding: 10px; margin-bottom: 15px; border-radius: 8px;
      color: #fff; font-size: 14px;
    }
    @media (max-width: 500px) {
      .form-container { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="container">
    <div class="form-container">
      <h2>🛠️ ChalakSetu Sign Up</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/signup" method="POST">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>

        <div class="input-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="your@example.com" required>
        </div>

        <div class="input-group">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone" placeholder="Optional phone number">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
        </div>

        <div class="input-group">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
        </div>

        <button type="submit">Sign Up</button>
      </form>

      <div class="form-actions">
        Already have an account? <a href="/">Log in here</a>
      </div>
    </div>
  </div>

</body>
</html>
